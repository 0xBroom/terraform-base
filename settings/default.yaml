# ===================================================================
# DEFAULT SETTINGS, shared by every workspace
# ===================================================================
# Each workspace file (settings/<workspace>.yaml) is merged on top of this one.
# Keep here only what every project of yours shares; override the rest per workspace.

# Placeholders so `terraform validate` works on the default workspace. That is
# the workspace CI checks. A real environment is settings/dev.yaml,
# settings/stg.yaml or settings/pro.yaml, and those files replace these maps.
# Replace them before any plan of the default workspace.
project:
  id: "my-project-id"
  name: "my-project"
  number: "000000000000"

security:
  alerts_email: "alerts@example.com"

# System/monitoring project: the shared ops project in the `common` folder, which
# also holds the Terraform state bucket (see AGENTS.md). Replace the placeholders
# before the first plan.
project_sys:
  id: "my-system-project-id" #Mandatory parameter
  name: "my-system-project" #Mandatory parameter
  number: "000000000000" #Mandatory parameter
region_name: europe-west1
zones_name:
  - europe-west1-b
# Short prefix for every resource name: "<client.name>-<resource>".
client:
  name: "app"
iac:
  repo: "terraform-base"
# Default empty app.service structure - override in environment files
app:
  service: {}
active-apis:
  # Core Infrastructure
  - "compute.googleapis.com"
  - "cloudresourcemanager.googleapis.com"
  - "iam.googleapis.com"
  - "iamcredentials.googleapis.com"
  - "servicenetworking.googleapis.com"
  - "vpcaccess.googleapis.com"

  # Container and Build Services
  - "cloudbuild.googleapis.com"
  - "run.googleapis.com"
  - "artifactregistry.googleapis.com"
  #- "containeranalysis.googleapis.com"

  # Storage Services
  - "storage.googleapis.com"
  - "sqladmin.googleapis.com"
  - "redis.googleapis.com"

  # AI and ML Services
  #- "aiplatform.googleapis.com"
  #- "texttospeech.googleapis.com"
  #- "speech.googleapis.com"
  #- "vision.googleapis.com"

  # Security and Secrets
  - "secretmanager.googleapis.com"
  #- "cloudarmor.googleapis.com"
  - "iap.googleapis.com"

  # Load Balancer and Certificates
  - "certificatemanager.googleapis.com"
  - "dns.googleapis.com"

  # Queues
  - "pubsub.googleapis.com"
  - "cloudtasks.googleapis.com"
  - "cloudscheduler.googleapis.com"

  # Data Services
  - "firestore.googleapis.com"

  # Monitoring and Logging
  - "monitoring.googleapis.com"
  - "logging.googleapis.com"

  # Billing Management
  - "billingbudgets.googleapis.com"
  - "cloudbilling.googleapis.com"

  # Cloud Functions
  - "cloudfunctions.googleapis.com"
  - "eventarc.googleapis.com"
