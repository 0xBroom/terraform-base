# Pro workspace. Same resources as pre, sized and protected for production.
# Replace every example-app-pro, 000000-000000-000000 and replace-me@example.com
# before the first plan. Do not apply this file as it is.
# project_sys is this same project until several apps share one monitoring project.
# Do not set active-apis here. merge() would drop the list in default.yaml.

project:
  id: "example-app-pro"
  name: "example-app-pro"
  number: "000000000000"

project_sys:
  id: "example-app-pro"
  name: "example-app-pro"
  number: "000000000000"

security:
  alerts_email: "replace-me@example.com"
  audit_logging:
    admin_read: true
    data_read: false
    data_write: false
  artifact_scanning: true

logging:
  retention_days: 90
  # Locked: the retention cannot be shortened and the bucket cannot be deleted
  # until its oldest entry is 365 days old. Storage past 30 days is billed.
  audit_archive:
    retention_days: 365
    locked: true

# Log-based alerts on audit log events, one email per change. Replace the
# excluded principal with the identity that runs terraform apply, or every
# apply that touches IAM or a firewall pages the channel.
monitoring:
  excluded_principals:
    - "terraform@example-app-pro.iam.gserviceaccount.com"
  log_alerts:
    iam_policy_change:
      enabled: true
    service_account_key_created:
      enabled: true
    firewall_change:
      enabled: true
    audit_config_change:
      enabled: true
    custom_role_change:
      enabled: true
    sql_instance_change:
      enabled: true
    bucket_iam_change:
      enabled: true

# Dry-run until images are signed. The hello image is on the whitelist.
binary_authorization:
  enabled: true
  enforcement_mode: "DRYRUN_AUDIT_LOG_ONLY"

budget:
  billing_account: "000000-000000-000000"
  amount: 400
  alert_spent_percents:
    - 0.5
    - 0.75
    - 0.9
    - 1.0
  # The code default is true. Leaving this line out deploys a function that
  # disables billing when the budget is hit. Pro must not do that by surprise.
  enable_auto_stop: false

lb:
  domain:
    - "app.example.com"
  timeout_sec: 30

iap:
  admin_access:
    members:
      - "user:replace-me@example.com"

project_access:
  viewers:
    - "user:replace-me@example.com"
  operators:
    - "user:replace-me@example.com"

repo_providers:
  default: github
  github:
    owner: "example-org"
    app_installation_id: 1
    connection_name: "github-repo-connection"

app:
  service:
    api:
      name: "api"
      loadbalancer:
        rules:
          - path: "/*"
            rewrite: "/"
            iap:
              enabled: true
              use_default_members: true
      cloudbuild:
        repo_name: "example-api"
        inline: true
        dockerfile_path: "Dockerfile"
        build_context_path: "."
        # Default tag pattern for this workspace: ^pro-[0-9]{8}[0-9]{2}$
        scan:
          secrets_blocking: true
          sast: true
          deps: true
      cloudrun:
        allow_unauthenticated: false
        ingress: "INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER"
        deletion_protection: true
        min_instances: 1
        max_instances: 10
        concurrency: 80
        container_port: 8080
        timeout: "300s"
        cpu: 2
        ram: "2048Mi"
        vpc_access_enabled: true
        db_host_from_database: "main"
        additional_roles:
          - "roles/cloudsql.client"
        env:
          - name: DB_HOST
            value: "pending"
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: "api-db"
          - name: DB_USER
            value: "api-app-user"
        secret_env:
          - name: DATABASE_PASSWORD
            var_name: DB_PASSWORD

bucket:
  uploads:
    name: "uploads"
    class: "REGIONAL"
    uniform_access: true
    enable_versioning: true
    soft_delete_days: 30
    force_destroy: false
    permissions:
      api:
        members:
          - "cloudrun:api"
        roles:
          - "roles/storage.objectAdmin"

network:
  network_tier: PREMIUM
  internal_connection: true
  services_cidr: "10.20.1.0/24"
  private_google_access: true
  nats:
    services:
      region: europe-west1
      number_of_addresses: 1

database:
  main:
    name: "main"
    sql:
      version: "POSTGRES_15"
      tier: "db-custom-2-7680"
      availability: "REGIONAL"
      ipv4_enabled: false
      ssl_mode: "ENCRYPTED_ONLY"
      deletion_protection: true
      disk:
        type: "PD_SSD"
        size: 20
      flags:
        max_connections: 200
        log_connections: "on"
        log_disconnections: "on"
        log_min_duration_statement: "1000"
        log_lock_waits: "on"
        cloudsql.enable_pgaudit: "on"
        pgaudit.log: "ddl,role"
      special_password:
        enabled: true
        characters: "-_.~"
      backup:
        start_time: "02:00"
        retained_backups: 30
        location: "eu"
        point_in_time_recovery_enabled: true
        transaction_log_retention_days: 7
      maintenance:
        day: 3
        hour: 4
      insights:
        enabled: true
        query_plans_per_minute: 5

redis:
  cache:
    name: "cache"
    memory_size_gb: 1
    tier: "STANDARD_HA"
    connect_mode: "PRIVATE_SERVICE_ACCESS"
    auth_enabled: true
    transit_encryption_mode: "SERVER_AUTHENTICATION"
    redis_version: "REDIS_7_0"
