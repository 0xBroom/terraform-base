# ═══════════════════════════════════════════════════════════════════════════════
# 21. CLOUD LOGGING RETENTION AND AUDIT ARCHIVE
# ═══════════════════════════════════════════════════════════════════════════════
# _Default is always managed (30 days, 90 in pro, unless set). _Required is
# only touched when required_retention_days is set.
#
# audit_archive creates a dedicated log bucket and a sink that copies every
# Cloud Audit Log (activity, data_access, system_event, policy) into it. Omit
# it and nothing is created. The bucket sits in the same project, so the sink
# needs no IAM grant.
#
# WARNING: locked: true cannot be undone. A locked bucket cannot be unlocked,
# its retention_days can only grow, and it cannot be deleted (terraform destroy
# fails) until every entry in it is older than retention_days. Choose the
# retention before locking.
# COST: logs routed to this bucket count as ingestion (past the free monthly
# allotment it is billed), and storage beyond 30 days is billed per GiB-month.
# Keep it out of dev and stg.
# logging:
#   retention_days: 90                              # [OPTIONAL] _Default retention in days (default: 30, 90 in pro)
#   required_retention_days: 400                    # [OPTIONAL] _Required retention, at least 400. Omit to leave it alone
#   audit_archive:                                  # [OPTIONAL] Absent: no archive bucket and no sink
#     retention_days: 365                           # [MANDATORY] Days kept, 1 to 3650
#     locked: true                                  # [OPTIONAL] Lock the retention policy (default: false). Irreversible
#     location: "global"                            # [OPTIONAL] Bucket location (default: global), e.g. "europe-west1"
#     bucket_id: "audit-archive"                    # [OPTIONAL] Bucket id (default: audit-archive)
#     filter: 'log_id("cloudaudit.googleapis.com/activity")'  # [OPTIONAL] Replaces the default filter (all four audit logs)


# ═══════════════════════════════════════════════════════════════════════════════
# 22. WORKLOAD IDENTITY FEDERATION (EXTERNAL CI WITHOUT KEYS)
# ═══════════════════════════════════════════════════════════════════════════════
# Lets GitHub Actions, GitLab CI or any OIDC issuer act as a service account with
# short-lived tokens, so no service account key is ever created. Omit `wif` and
# nothing is created. When present it also enables sts.googleapis.com. No cost.
#
# Each provider MUST have an attribute_condition: without it any token of the
# issuer (any repository on github.com) could use the pool, and the plan stops.
# Default attribute_mapping per type (an attribute_mapping you set is merged over it):
#   github: google.subject, attribute.actor, attribute.repository,
#           attribute.repository_owner, attribute.ref, attribute.workflow_ref
#   gitlab: google.subject, attribute.actor (user_login), attribute.repository
#           (project_path), attribute.namespace_path, attribute.ref, attribute.ref_type
#   oidc:   google.subject only
#
# A binding's service_account is an existing email, or a short key that creates
# <client.name>-<key> (6 to 30 characters in total). principal_set selects who in
# the pool may impersonate it: attribute.<name>/<value>, or * for every identity
# the providers' conditions already accepted. Guide: docs/WIF.md.
wif:
  pools:
    ci-pool:                                        # [MANDATORY] Pool id, 4 to 32 of a-z 0-9 -, not gcp-*
      display_name: "External CI"                   # [OPTIONAL] Default: the key
      description: "CI pipelines of example-app"    # [OPTIONAL]
      providers:
        github:                                     # [MANDATORY] Provider id, same rule as the pool id
          type: "github"                            # [OPTIONAL] github | gitlab | oidc (default: oidc)
          attribute_condition: "assertion.repository == 'example-org/example-repo'"  # [MANDATORY]
          # issuer_uri: "https://token.actions.githubusercontent.com"  # [OPTIONAL] Default per type, MANDATORY for oidc
          # allowed_audiences: []                   # [OPTIONAL] Default: the provider resource name
          # attribute_mapping:                      # [OPTIONAL] Merged over the type default
          #   attribute.environment: "assertion.environment"
        # gitlab:
        #   type: "gitlab"
        #   issuer_uri: "https://gitlab.example.com"  # self-managed GitLab; gitlab.com is the default
        #   attribute_condition: "assertion.namespace_path == 'example-group'"
      bindings:
        - service_account: "deployer"               # [MANDATORY] Key (creates <client.name>-deployer) or an existing email
          principal_set: "attribute.repository/example-org/example-repo"  # [MANDATORY]
          roles:                                    # [OPTIONAL] Project roles granted to the service account
            - "roles/run.developer"
            - "roles/artifactregistry.writer"
        # - service_account: "existing-sa@example-app-dev.iam.gserviceaccount.com"
        #   principal_set: "attribute.ref/refs/heads/main"
